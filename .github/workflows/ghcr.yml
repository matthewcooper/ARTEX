# Fork-only: builds the upstream Dockerfile at a release tag for linux/amd64 (Whitecrane)
# and pushes ghcr.io/<owner>/artex:<tag>. Run: gh workflow run ghcr -R matthewcooper/ARTEX -f ref=v0.7.0
name: ghcr
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Upstream tag to build
        required: true
        default: v0.7.0

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: ARTEX_VERSION=${{ inputs.ref }}
          tags: ghcr.io/${{ github.repository_owner }}/artex:${{ inputs.ref }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
