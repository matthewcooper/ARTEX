# Fork-only: builds the upstream Dockerfile at a release tag for linux/amd64 (Whitecrane)
# and pushes ghcr.io/<owner>/artex:<tag>. Run: gh workflow run ghcr -R matthewcooper/ARTEX -f ref=v0.7.0
name: ghcr
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Upstream tag to build
        required: true
        default: v0.7.0

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: ARTEX_VERSION=${{ inputs.ref }}
          tags: ghcr.io/${{ github.repository_owner }}/artex:${{ inputs.ref }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
